name: Build RTP Duels

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: |
          set -o pipefail
          if ! mvn -B clean package 2>&1 | tee build.log; then
            echo "::warning::Build against the 1.21.11 API failed - retrying against the old 1.16.5 API"
            mvn -B clean package -Dpaper.api.group=com.destroystokyo.paper -Dpaper.api.version=1.16.5-R0.1-SNAPSHOT 2>&1 | tee build-retry.log
          fi

      - name: Check the jar really is Java 8 bytecode
        run: |
          cd "$(mktemp -d)"
          unzip -q "$GITHUB_WORKSPACE/target/RTPDuels.jar" 'com/rtpduels/plugin/RTPDuels.class' plugin.yml config.yml
          javap -v com/rtpduels/plugin/RTPDuels.class | grep 'major version'
          javap -v com/rtpduels/plugin/RTPDuels.class | grep -q 'major version: 52'
          grep -q 'folia-supported: true' plugin.yml
          grep -q "version: '1.1.0'" plugin.yml

      - name: Write failure details to the run summary
        if: failure()
        run: |
          {
            echo "## Build failed"
            echo
            echo '```'
            grep -h -E "ERROR|error:" build.log build-retry.log 2>/dev/null | sort -u | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: RTPDuels
          path: target/RTPDuels.jar
