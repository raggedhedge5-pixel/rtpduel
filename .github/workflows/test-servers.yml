name: Test on real servers

# Optional. Run it by hand (Actions tab -> "Test on real servers" -> Run workflow).
# It builds the plugin, then boots a REAL Paper / Folia server for each Minecraft version below,
# installs the jar, lets the plugin run its built-in self-check and verifies it passes.
# Every job is independent - one red job tells you exactly which version has a problem.
# Versions with no server build on the PaperMC download site are reported as skipped, not failed.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: |
          set -o pipefail
          if ! mvn -B clean package 2>&1 | tee build.log; then
            mvn -B clean package -Dpaper.api.group=com.destroystokyo.paper -Dpaper.api.version=1.16.5-R0.1-SNAPSHOT
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RTPDuels
          path: target/RTPDuels.jar

  server-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: paper, mc: '1.8.8', java: 8 }
          - { project: paper, mc: '1.9.4', java: 8 }
          - { project: paper, mc: '1.10.2', java: 8 }
          - { project: paper, mc: '1.11.2', java: 8 }
          - { project: paper, mc: '1.12.2', java: 8 }
          - { project: paper, mc: '1.13.2', java: 8 }
          - { project: paper, mc: '1.14.4', java: 8 }
          - { project: paper, mc: '1.15.2', java: 8 }
          - { project: paper, mc: '1.16.5', java: 11 }
          - { project: paper, mc: '1.17.1', java: 17 }
          - { project: paper, mc: '1.18.2', java: 17 }
          - { project: paper, mc: '1.19.4', java: 17 }
          - { project: paper, mc: '1.20.1', java: 17 }
          - { project: paper, mc: '1.20.4', java: 17 }
          - { project: paper, mc: '1.20.6', java: 21 }
          - { project: paper, mc: '1.21.1', java: 21 }
          - { project: paper, mc: '1.21.4', java: 21 }
          - { project: paper, mc: '1.21.8', java: 21 }
          - { project: paper, mc: '1.21.11', java: 21 }
          - { project: paper, mc: '26.1.2', java: 25 }
          - { project: paper, mc: '26.2', java: 25 }
          - { project: paper, mc: '26.3', java: 25 }
          - { project: folia, mc: '1.19.4', java: 17 }
          - { project: folia, mc: '1.20.1', java: 17 }
          - { project: folia, mc: '1.20.4', java: 17 }
          - { project: folia, mc: '1.20.6', java: 21 }
          - { project: folia, mc: '1.21.4', java: 21 }
          - { project: folia, mc: '1.21.8', java: 21 }
          - { project: folia, mc: '1.21.11', java: 21 }
          - { project: folia, mc: '26.1.2', java: 25 }
          - { project: folia, mc: '26.3', java: 25 }
    name: ${{ matrix.project }} ${{ matrix.mc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RTPDuels
          path: jar
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Boot server and run selftest
        run: |
          set +e
          tools/smoke_test.sh "${{ matrix.project }}" "${{ matrix.mc }}" "$GITHUB_WORKSPACE/jar/RTPDuels.jar" 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 2 ]; then
            echo "- SKIPPED ${{ matrix.project }} ${{ matrix.mc }} (no server build available)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "- PASS ${{ matrix.project }} ${{ matrix.mc }}" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "- FAIL ${{ matrix.project }} ${{ matrix.mc }}"
              echo '```'
              grep -E 'RTPDuels|RTP Duels|SELFTEST|ERROR|Exception' test.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
